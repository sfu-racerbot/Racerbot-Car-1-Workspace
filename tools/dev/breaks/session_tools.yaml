  old: '            values = [c.get(k, [])[i] if i < len(c.get(k, [])) else math.nan for k in ("sectors", "sector_cmd", "sector_steer")]'
  new: '            values = [c.get(k, [])[i] if i < len(c.get(k, [])) else math.nan for k in ("sectors", "sector_cmd", "sector_cmd")]'
