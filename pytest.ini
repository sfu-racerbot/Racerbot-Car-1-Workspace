# Makes this directory pytest's rootdir for every suite in the workspace, however it is run
# (python3 -m pytest src/<pkg>/test from here, or colcon test, which runs pytest inside each
# package's source directory). Without it, pytest takes a package with a setup.py as its own
# rootdir and never loads ../../conftest.py, so tests in pure_pursuit, race_diagnostics,
# racerbot_doctor, gap_follow and the other ament_python packages saw the car's real Jetson
# serial (car 1, 2026-11-01). Keep it free of options. A package's own pytest config is found
# first and drops that conftest.py too, so none is allowed below this directory except the
# vendored src/f1tenth_system/teleop_tools/pytest.ini, whose suites never import racerbot_car
# (src/racerbot_car/test/test_no_package_pytest_config.py). Register markers from the package's
# conftest.py instead.
[pytest]
