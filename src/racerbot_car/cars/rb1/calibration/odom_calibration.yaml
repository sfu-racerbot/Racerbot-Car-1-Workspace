odom_calibration_node:
  ros__parameters:
    # --- This car ------------------------------------------------------------
    # Change these for another car; nothing else in the wizard is car-specific.
    vehicle_model: "Traxxas Ford Fiesta ST Rally VXL 74276-4 (car 1)"
    # Largest steering angle any driving node may request (gap_follow.yaml and
    # pure_pursuit.yaml max_steering_angle). The clamp check warns when
    # servo_min/servo_max cut it short on either side.
    planner_max_steering_rad: 0.33
    # Fallbacks, used only until the live values are read from the running
    # nodes (vesc_to_odom_node, ackermann_to_vesc_node, vesc_driver_node).
    speed_to_erpm_gain: -4040.0
    steering_angle_to_servo_gain: -0.83
    steering_angle_to_servo_offset: 0.366
    servo_min: 0.05
    servo_max: 0.75
