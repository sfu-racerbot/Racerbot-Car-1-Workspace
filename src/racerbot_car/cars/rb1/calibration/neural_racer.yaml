neural_racer_node:
  ros__parameters:
    # Safety wrapper -- gap_follow.yaml's values, except max_lateral_accel and
    # max_invalid_fraction. max_lateral_accel is set on its own line below:
    # gap_follow moved to 2.5 (decided 2026-10-26), and neural_racer deliberately
    # keeps 2.0 (training cap unchanged). See src/neural_racer/test/test_config.py.
    # max_invalid_fraction is neural_racer's own value; gap_follow has no such key.
    # Each can only lower speed.
    max_steering_angle: 0.33
