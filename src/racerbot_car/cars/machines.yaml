# Which car each Jetson is. Key: the Jetson's serial number, exactly as
# `tr -d '\0' < /proc/device-tree/serial-number` prints it, QUOTED (a bare
# number would lose leading zeros). Value: the car id, a folder next to this file.
# A machine not listed here (a dev box) must set RACERBOT_CAR=rb1|rb2 to run anything.
"1421723021900": rb1
