/auto_record:
  ros__parameters:
    ignore_publishers:
    - ackermann_mux
    - ackermann_to_vesc_node
    - rosbag2_player*
    min_free_gb: 2.0
    other_recorders:
    - race_diag_node
    - rosbag2_recorder*
    output_directory: ~/racerbot-ws/data/racerbot_runs
    poll_period_sec: 0.5
    record_bag: true
    start_delay_sec: 3.0
    start_type_description_service: true
    stop_delay_sec: 3.0
    stop_timeout_sec: 15.0
    topics: ''
    trigger_topics:
    - /drive
    - /auto_map/drive
    - /auto_race/drive
    - /neural_racer/shadow_drive
    - /ackermann_cmd
    - /commands/motor/speed
    - /commands/servo/position
    use_sim_time: false
