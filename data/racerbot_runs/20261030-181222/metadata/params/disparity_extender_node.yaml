/disparity_extender_node:
  ros__parameters:
    alpha: 0.8
    car_width: 0.4
    car_width_extended: 0.65
    disparity_threshold: 1.0
    enable_safety: true
    fov_half_angle_deg: 90.0
    max_lateral_acc: 3.5
    max_lidar_range: 25.0
    max_speed: 3.0
    min_speed: 0.5
    minimum_gap_threshold: 0.1
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    start_type_description_service: true
    use_sim_time: false
    wheelbase: 0.33
